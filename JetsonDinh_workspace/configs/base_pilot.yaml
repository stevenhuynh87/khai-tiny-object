project:
  name: "Edge-ReDHF"
  phase: "pilot"
  anchor_architecture: "Dome-DETR-S"
  fallback_architecture: "RT-DETR"

reproducibility:
  seeds: [2025, 2026, 2027]
  default_seed: 2025
  deterministic: true
  cudnn_benchmark: false

dataset:
  name: "AI-TOD-v2"
  root_dir: "F:/Jetson Quậy/CV_PR_HVTD/data/AI-TOD-v2"
  input_resolution: [800, 800]
  evaluator: "aitodpycocotools"
  train_annotation: "F:/Jetson Quậy/CV_PR_HVTD/data/AI-TOD-v2/annotations/aitodv2_train.json"
  val_annotation: "F:/Jetson Quậy/CV_PR_HVTD/data/AI-TOD-v2/annotations/aitodv2_val.json"
  trainval_annotation: "F:/Jetson Quậy/CV_PR_HVTD/data/AI-TOD-v2/annotations/aitodv2_trainval.json"
  test_annotation: "F:/Jetson Quậy/CV_PR_HVTD/data/AI-TOD-v2/annotations/aitodv2_test.json"

benchmark:
  batch_size: 1
  warmup_iterations: 100
  measured_iterations: 1000
  input_shape: [1, 3, 800, 800]
  target_fps_primary: 25.0
  target_fps_fallback: 15.0
  report_metrics:
    - "params_M"
    - "gflops"
    - "peak_vram_MB"
    - "latency_mean_ms"
    - "latency_p50_ms"
    - "latency_p95_ms"
    - "fps"

source_repositories:
  dome_detr: "F:/Jetson Quậy/CV_PR_HVTD/third_party/Dome-DETR"
  rtdetr_fallback: "lyuwenyu/RT-DETR"
